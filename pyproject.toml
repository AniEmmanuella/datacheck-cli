
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacheck-cli"
version = "0.1.0"
description = "A typed command-line toolkit for validating CSV datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
datacheck = "datacheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

